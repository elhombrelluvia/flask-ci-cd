services:

  api:
    image: ${DOCKERHUB_USERNAME}/${DOCKER_IMAGE}:${IMAGE_TAG}
    container_name: flask-api
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    # MEJORA: Espera a que la BD esté lista para recibir consultas, no solo encendida
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: postgres:16
    container_name: postgres-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # MEJORA: Comando nativo para verificar el estado real de Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # MEJORA: Nginx solo enciende si la API ya arrancó exitosamente
    depends_on:
      api:
        condition: service_started
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network: